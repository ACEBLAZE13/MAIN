
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support the Fundraiser</title>
<style>
  :root {
    --ink: #1b1b18;
    --paper: #faf7f2;
    --accent: #1a5e3a;
    --accent-soft: #e4efe8;
    --line: #d8d2c6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 32px;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 11px;
    color: var(--accent);
    font-family: -apple-system, system-ui, sans-serif;
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 10px;
  }
  p.desc {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
    color: #4a473f;
    margin: 0 0 28px;
  }
  .amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .amounts button {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 0;
    border: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .amounts button.active,
  .amounts button:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .custom-row span {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px;
    color: #4a473f;
  }
  .custom-row input {
    flex: 1;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .donate-btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    font-family: -apple-system, system-ui, sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 15px 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .donate-btn:hover { background: #144a2d; }
  .note {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
    color: #8a8578;
    margin-top: 14px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Fundraiser</div>
  <h1>Help make a difference</h1>
  <p class="desc">Every contribution goes straight through PayPal to the organizer — no platform fees, no middleman holding your money.</p>

  <div class="amounts">
    <button type="button" data-amount="10">$10</button>
    <button type="button" data-amount="25" class="active">$25</button>
    <button type="button" data-amount="50">$50</button>
  </div>

  <div class="custom-row">
    <span>$</span>
    <input type="number" id="customAmount" min="1" step="1" placeholder="Custom amount">
  </div>

  <a href="#" id="donateBtn" class="donate-btn" target="_blank" rel="noopener">Donate via PayPal</a>

  <p class="note">You'll be taken to PayPal to complete your donation securely.<br>Funds go directly to the organizer's PayPal account.</p>
</div>

<script>
  // --- Configure this ---
  const FUNDRAISER_PAYPAL_EMAIL = "kayizziaaron37@gmail.com"; // replace with the real PayPal email
  const CURRENCY = "USD"; // e.g. USD, AED, GBP
  const CAMPAIGN_NAME = "Support the Fundraiser"; // shows up on the PayPal page
  // -----------------------

  let selectedAmount = 25;

  const amountButtons = document.querySelectorAll('.amounts button');
  const customInput = document.getElementById('customAmount');
  const donateBtn = document.getElementById('donateBtn');

  amountButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      amountButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedAmount = parseFloat(btn.dataset.amount);
      customInput.value = '';
      updateLink();
    });
  });

  customInput.addEventListener('input', () => {
    if (customInput.value) {
      amountButtons.forEach(b => b.classList.remove('active'));
      selectedAmount = parseFloat(customInput.value) || 0;
      updateLink();
    }
  });

  function updateLink() {
    const amount = selectedAmount > 0 ? selectedAmount.toFixed(2) : '';
    const url = new URL("https://www.paypal.com/donate");
    url.searchParams.set("business", FUNDRAISER_PAYPAL_EMAIL);
    url.searchParams.set("currency_code", CURRENCY);
    url.searchParams.set("item_name", CAMPAIGN_NAME);
    if (amount) url.searchParams.set("amount", amount);
    donateBtn.href = url.toString();
  }

  updateLink();
</script>

</body>
</html>
